  <rect x="290" y="106" width="160" height="100" rx="8" fill="#101F38" stroke="#1E3760" stroke-width="1" />
  <circle cx="370" cy="146" r="26" fill="#00C6FF" fill-opacity="0.2" stroke="#00C6FF" stroke-width="1.5" />
  <path d="M 300 190 Q 340 160 370 175 T 440 150" stroke="#00C6FF" stroke-width="2" fill="none" />

  <!-- 3-column cards inside desktop screen -->
  <rect x="50" y="220" width="120" height="90" rx="6" fill="#0D1A30" stroke="#1A2F50" stroke-width="1" />
  <rect x="62" y="235" width="20" height="20" rx="4" fill="#00C6FF" fill-opacity="0.3" />
  <rect x="62" y="265" width="80" height="6" rx="2" fill="#475569" />
  <rect x="62" y="278" width="60" height="6" rx="2" fill="#334155" />

  <rect x="190" y="220" width="120" height="90" rx="6" fill="#0D1A30" stroke="#1A2F50" stroke-width="1" />
  <rect x="202" y="235" width="20" height="20" rx="4" fill="#10B981" fill-opacity="0.3" />
  <rect x="202" y="265" width="80" height="6" rx="2" fill="#475569" />
  <rect x="202" y="278" width="60" height="6" rx="2" fill="#334155" />

  <rect x="330" y="220" width="120" height="90" rx="6" fill="#0D1A30" stroke="#1A2F50" stroke-width="1" />
  <rect x="342" y="235" width="20" height="20" rx="4" fill="#818CF8" fill-opacity="0.3" />
  <rect x="342" y="265" width="80" height="6" rx="2" fill="#475569" />
  <rect x="342" y="278" width="60" height="6" rx="2" fill="#334155" />

  <!-- Overlapping Mobile Phone Mockup -->
  <rect x="490" y="80" width="180" height="340" rx="24" fill="#070D18" stroke="#253D68" stroke-width="3" />
  <rect x="540" y="90" width="80" height="14" rx="7" fill="#132034" />
  <circle cx="595" cy="97" r="3" fill="#1E293B" />
  
  <!-- Mobile screen content -->
  <rect x="505" y="118" width="150" height="50" rx="8" fill="#0F1F38" />
  <rect x="515" y="130" width="100" height="10" rx="3" fill="url(#screen-grad)" />
  <rect x="515" y="148" width="70" height="8" rx="2" fill="#1769FF" />

  <rect x="505" y="178" width="150" height="60" rx="8" fill="#0B1628" stroke="#1E3254" stroke-width="1" />
  <circle cx="525" cy="198" r="10" fill="#00C6FF" fill-opacity="0.3" />
  <rect x="545" y="195" width="80" height="6" rx="2" fill="#94A3B8" />
  <rect x="545" y="208" width="50" height="6" rx="2" fill="#475569" />

  <rect x="505" y="248" width="150" height="60" rx="8" fill="#0B1628" stroke="#1E3254" stroke-width="1" />
  <circle cx="525" cy="268" r="10" fill="#10B981" fill-opacity="0.3" />
  <rect x="545" y="265" width="80" height="6" rx="2" fill="#94A3B8" />
  <rect x="545" y="278" width="50" height="6" rx="2" fill="#475569" />

  <!-- Mobile Home indicator -->
  <rect x="545" y="405" width="70" height="4" rx="2" fill="#334155" />

  <!-- Bottom Details Bar -->
  <rect x="30" y="355" width="440" height="65" rx="8" fill="#091220" stroke="#1A2D4A" stroke-width="1" />
  <text x="48" y="380" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BESPOKE RESPONSIVE ARCHITECTURE</text>
  <text x="48" y="402" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="10">Mobile-First • Conversion-Oriented • Micro-Interactions</text>
</svg>
