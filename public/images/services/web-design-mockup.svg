<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="webdesign-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1428" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1769FF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" rx="12" fill="url(#webdesign-bg)" stroke="#1B2E50" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="700" height="42" fill="#0A162B" />
  <line x1="0" y1="42" x2="700" y2="42" stroke="#1B2E50" stroke-width="1" />
  <circle cx="20" cy="21" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="36" cy="21" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="52" cy="21" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="26" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Nexovio Web Design • Responsive Multi-Device Canvas</text>
  <rect x="580" y="11" width="100" height="20" rx="10" fill="#00C6FF" fill-opacity="0.15" stroke="#00C6FF" stroke-opacity="0.3" />
  <text x="592" y="25" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">FLUID LAYOUTS</text>

  <!-- Desktop Browser Screen Mockup -->
  <rect x="30" y="65" width="440" height="270" rx="10" fill="#08101E" stroke="#1F3459" stroke-width="1.5" />
  <rect x="30" y="65" width="440" height="26" fill="#0E192E" />
  <circle cx="46" cy="78" r="3.5" fill="#EF4444" opacity="0.8" />
  <circle cx="58" cy="78" r="3.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="70" cy="78" r="3.5" fill="#10B981" opacity="0.8" />
  <rect x="140" y="71" width="220" height="14" rx="4" fill="#152442" />

  <!-- Hero inside Desktop mockup -->
  <rect x="50" y="110" width="180" height="16" rx="4" fill="url(#screen-grad)" />
  <rect x="50" y="136" width="220" height="8" rx="2" fill="#334155" />
  <rect x="50" y="150" width="180" height="8" rx="2" fill="#334155" />
  <rect x="50" y="174" width="80" height="26" rx="6" fill="#1769FF" />
  <rect x="140" y="174" width="80" height="26" rx="6" fill="#152442" stroke="#253554" stroke-width="1" />

