<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Electric Blue to Bright Cyan -->
    <linearGradient id="nexovioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1769FF" />
      <stop offset="50%" stop-color="#008CFF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="60%" stop-color="#1769FF" />
      <stop offset="100%" stop-color="#0A1020" />
    </linearGradient>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="500" height="500" rx="24" fill="#03050A" />

  <!-- Circular Ring Emblem -->
  <!-- White lower-right arc -->
  <circle cx="250" cy="190" r="110" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="380 400" stroke-dashoffset="-140" />
  
  <!-- Cyan/Blue upper-left arc -->
  <circle cx="250" cy="190" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="380 400" stroke-dashoffset="190" />

  <!-- Futuristic Angular 'N' Monogram -->
  <g id="nexovio-emblem">
    <!-- Left Stem and Diagonal Chevron (Electric Blue & Cyan Gradient) -->
    <path d="M 180 140 
             L 225 140 
             L 292 232 
             L 292 195 
             L 255 145 
             L 215 145 
             L 212 258 
             L 165 292 
             L 180 230 
             L 180 140 Z" 
          fill="url(#nexovioGrad)" />

    <!-- Right Vertical Architectural Stem (Crisp White with Geometrical Bevels) -->
    <path d="M 292 115 
             L 335 115 
             L 292 168 
             L 292 230 
             L 245 230 
             L 292 270 
             L 322 270 
             L 322 152 
             L 292 190 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <!-- NEXOVIO -->
  <g id="brand-text">
    <!-- White 'NEXO' -->
    <text x="175" y="375" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="52" 
          letter-spacing="5" 
          fill="#FFFFFF">NEXO</text>
    
    <!-- Gradient 'VIO' -->
    <text x="325" y="375" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="52" 
          letter-spacing="5" 
          fill="url(#nexovioGrad)">VIO</text>

    <!-- Subtitle: DIGITAL SOLUTIONS -->
    <text x="250" y="415" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" 
          font-size="16" 
          letter-spacing="7" 
          fill="#A7B0C0">DIGITAL SOLUTIONS</text>
  </g>
</svg>
