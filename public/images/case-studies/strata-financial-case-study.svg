  <text x="618" y="254" fill="#10B981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">22.1% <tspan font-size="11" fill="#6EE7B7">(-48%)</tspan></text>

  <rect x="604" y="282" width="232" height="66" rx="8" fill="#060C16" stroke="#15243C" stroke-width="1" />
  <text x="618" y="304" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">SECURITY STANDARD</text>
  <text x="618" y="330" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Bank-Grade TLS &amp; CSP</text>

  <rect x="604" y="362" width="232" height="74" rx="8" fill="#060C16" stroke="#15243C" stroke-width="1" />
  <text x="618" y="386" fill="#A7B0C0" font-family="monospace" font-size="10">FEATURES: Custom Calculator,</text>
  <text x="618" y="404" fill="#A7B0C0" font-family="monospace" font-size="10">Client Portal Auth, Next.js,</text>
  <text x="618" y="422" fill="#38BDF8" font-family="monospace" font-size="10">Editorial Typography Design</text>
