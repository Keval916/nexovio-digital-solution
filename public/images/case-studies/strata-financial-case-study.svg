  <path d="M 80 230 Q 180 210 280 190 T 440 160 T 520 140" stroke="#38BDF8" stroke-width="3" fill="none" />
  <path d="M 80 245 Q 180 235 280 215 T 440 195 T 520 180" stroke="#818CF8" stroke-width="2" stroke-dasharray="3 3" fill="none" />
  <circle cx="440" cy="160" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

