  <circle cx="30" cy="25" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="25" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="66" cy="25" r="5" fill="#10B981" opacity="0.8" />
  <text x="100" y="30" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Nexovio Case Study // Lumina Health Patient Experience &amp; WCAG AA Systems</text>

  <rect x="740" y="14" width="130" height="24" rx="12" fill="#00E5A3" fill-opacity="0.15" stroke="#00E5A3" stroke-opacity="0.4" />
