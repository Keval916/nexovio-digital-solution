  <rect x="604" y="130" width="232" height="66" rx="8" fill="#050E1A" stroke="#122A4A" stroke-width="1" />
  <text x="618" y="152" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">SCHEDULE TIME</text>
  <text x="618" y="178" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="20" font-weight="800">48 Seconds <tspan font-size="11" fill="#6EE7B7">(-68%)</tspan></text>

  <rect x="604" y="206" width="232" height="66" rx="8" fill="#050E1A" stroke="#122A4A" stroke-width="1" />
  <text x="618" y="228" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">MOBILE RETENTION</text>
  <text x="618" y="254" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">82.4% <tspan font-size="11" fill="#7DD3FC">(+34%)</tspan></text>

  <rect x="604" y="282" width="232" height="66" rx="8" fill="#050E1A" stroke="#122A4A" stroke-width="1" />
  <text x="618" y="304" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">DESIGN SYSTEM</text>
  <text x="618" y="330" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Figma Tokens &amp; Tailwind</text>

  <rect x="604" y="362" width="232" height="74" rx="8" fill="#050E1A" stroke="#122A4A" stroke-width="1" />
  <text x="618" y="386" fill="#A7B0C0" font-family="monospace" font-size="10">ROLE: Research, Wireframing,</text>
  <text x="618" y="404" fill="#A7B0C0" font-family="monospace" font-size="10">Interactive Prototypes,</text>
  <text x="618" y="422" fill="#00E5A3" font-family="monospace" font-size="10">WCAG 2.1 AA Compliance</text>
