      <stop offset="0%" stop-color="#08182B" />
      <stop offset="50%" stop-color="#040F1E" />
      <stop offset="100%" stop-color="#02070F" />
    </linearGradient>
    <linearGradient id="lumina-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#00E5A3" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#cs-lumina-bg)" stroke="#16345A" stroke-width="1.5" />

  <!-- Top bar -->
