  <!-- Left: Main Mockup Window -->
  <rect x="40" y="80" width="520" height="380" rx="12" fill="#0A1D34" stroke="#1A3F6C" stroke-width="1.5" />
  
  <rect x="64" y="104" width="472" height="170" rx="8" fill="#061222" stroke="#122A4A" stroke-width="1" />
  <text x="80" y="130" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">ACCESSIBLE PATIENT TELEHEALTH DASHBOARD</text>

