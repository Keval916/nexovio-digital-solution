  <rect x="64" y="290" width="226" height="144" rx="8" fill="#061222" stroke="#122A4A" stroke-width="1" />
  <text x="80" y="316" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Scheduling Completion</text>
  <text x="80" y="348" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="26" font-weight="800">94.6%</text>
  <text x="80" y="370" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">Up from 68% prior to redesign</text>
  <text x="80" y="400" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="11">✔ 3-Step Guided Funnel</text>

