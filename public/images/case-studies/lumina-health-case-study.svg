  <text x="326" y="316" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Accessibility Rating</text>
  <text x="326" y="348" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="26" font-weight="800">WCAG AA</text>
  <text x="326" y="370" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">100% Screen Reader Certified</text>
  <text x="326" y="400" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="11">✔ High Contrast Tokens</text>

