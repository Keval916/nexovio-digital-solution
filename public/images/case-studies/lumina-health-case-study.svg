  <text x="170" y="176" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Dr. Sarah Lin, MD • Chief Cardiologist</text>
  <text x="170" y="198" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="12">● Encrypted HD Consultation in Session</text>
  <text x="170" y="218" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">Next Appointment: Today 3:00 PM • Duration 30 mins</text>

