<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lumina-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081424" />
      <stop offset="100%" stop-color="#03070E" />
    </linearGradient>
    <linearGradient id="lumina-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#071120" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lumina-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#00E5A3" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" rx="12" fill="url(#lumina-bg)" stroke="#172E4C" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="700" height="42" fill="#0A1628" />
  <line x1="0" y1="42" x2="700" y2="42" stroke="#172E4C" stroke-width="1" />
  <circle cx="20" cy="21" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="36" cy="21" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="52" cy="21" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="26" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Lumina Health • Clinical Patient Experience &amp; Telehealth Portal</text>
  
  <rect x="570" y="11" width="110" height="20" rx="10" fill="#00E5A3" fill-opacity="0.15" stroke="#00E5A3" stroke-opacity="0.3" />
  <text x="584" y="25" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="10" font-weight="700">WCAG 2.1 AA</text>

  <!-- Left Column: Patient Profile & Appointment Widget -->
  <rect x="24" y="58" width="220" height="370" rx="10" fill="url(#lumina-card)" stroke="#1A3354" stroke-width="1" />
  
  <!-- Doctor Avatar & Status -->
  <circle cx="64" cy="100" r="24" fill="#00C6FF" fill-opacity="0.2" stroke="#00C6FF" stroke-width="2" />
  <text x="56" y="106" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Dr</text>
  <text x="100" y="96" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dr. Sarah Lin</text>
  <text x="100" y="112" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="11">● Active Consultation</text>

  <!-- Telehealth Booking Slot -->
  <rect x="40" y="140" width="188" height="60" rx="8" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="52" y="162" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">NEXT AVAILABLE SESSION</text>
  <text x="52" y="184" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Today, 02:30 PM EST</text>

  <!-- UX Metrics -->
  <rect x="40" y="215" width="188" height="190" rx="8" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="52" y="238" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Patient UX Feedback</text>
  
  <text x="52" y="270" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="11">Booking Completion</text>
  <rect x="52" y="278" width="164" height="6" rx="3" fill="#11223A" />
  <rect x="52" y="278" width="154" height="6" rx="3" fill="url(#lumina-teal)" />
  <text x="180" y="270" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="11" font-weight="700">94%</text>

  <text x="52" y="315" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="11">Time to Schedule</text>
  <text x="52" y="340" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">48 sec</text>
  <text x="130" y="340" fill="#6B7C9E" font-family="system-ui, sans-serif" font-size="11">(-68% drop)</text>

  <text x="52" y="380" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="10">Accessibility Standard: AAA</text>

  <!-- Right Side: Vitals Chart & Consultation Flow -->
  <rect x="260" y="58" width="416" height="210" rx="10" fill="url(#lumina-card)" stroke="#1A3354" stroke-width="1" />
  <text x="280" y="88" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Real-Time Patient Vitals &amp; Biometrics</text>
  <text x="280" y="106" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">Frictionless patient onboarding telemetry</text>

  <!-- ECG / Pulse Wave -->
  <path d="M 280 170 L 320 170 L 335 130 L 350 200 L 365 150 L 380 170 L 430 170 L 445 120 L 460 210 L 475 140 L 490 170 L 550 170 L 565 125 L 580 205 L 595 155 L 610 170 L 650 170" stroke="#00E5A3" stroke-width="2.5" fill="none" />
  
  <rect x="280" y="210" width="116" height="40" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="292" y="226" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="9">PULSE RATE</text>
  <text x="292" y="242" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">72 bpm • Normal</text>

  <rect x="408" y="210" width="126" height="40" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="420" y="226" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="9">O2 SATURATION</text>
  <text x="420" y="242" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">99% • Optimal</text>

  <rect x="546" y="210" width="116" height="40" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="558" y="226" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="9">ENCRYPTION</text>
  <text x="558" y="242" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HIPAA Compliant</text>

  <!-- Right Bottom: Interactive Calendar & Prescription Timeline -->
  <rect x="260" y="280" width="416" height="148" rx="10" fill="url(#lumina-card)" stroke="#1A3354" stroke-width="1" />
  <text x="280" y="306" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Design System Deliverables</text>
  <text x="280" y="324" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">Human-centric UI tokens &amp; accessible color contrast system</text>

  <rect x="280" y="340" width="120" height="70" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="292" y="362" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Design Tokens</text>
  <text x="292" y="380" fill="#6B7C9E" font-family="system-ui, sans-serif" font-size="10">Figma Variables</text>
  <text x="292" y="396" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="10">48px Touch Targets</text>

  <rect x="412" y="340" width="120" height="70" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="424" y="362" fill="#00E5A3" font-family="system-ui, sans-serif" font-size="11" font-weight="600">User Flow</text>
  <text x="424" y="380" fill="#6B7C9E" font-family="system-ui, sans-serif" font-size="10">Zero Drop-off</text>
  <text x="424" y="396" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="10">3-Step Checkout</text>

  <rect x="544" y="340" width="118" height="70" rx="6" fill="#081426" stroke="#1A3050" stroke-width="1" />
  <text x="556" y="362" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Satisfaction</text>
  <text x="556" y="380" fill="#6B7C9E" font-family="system-ui, sans-serif" font-size="10">Survey Score</text>
  <text x="556" y="398" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="800">4.9 / 5.0</text>
</svg>
