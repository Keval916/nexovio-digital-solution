<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="strata-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="strata-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142138" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1322" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="gold-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" rx="12" fill="url(#strata-bg)" stroke="#22365A" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="0" y="0" width="700" height="42" fill="#0A1220" />
  <line x1="0" y1="42" x2="700" y2="42" stroke="#22365A" stroke-width="1" />
  <circle cx="20" cy="21" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="36" cy="21" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="52" cy="21" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="26" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Strata Financial Advisory • Institutional Wealth Management Platform</text>
  
  <rect x="580" y="11" width="100" height="20" rx="10" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.3" />
  <text x="596" y="25" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">$1.4B AUM</text>

  <!-- Top Metrics Overview -->
  <rect x="24" y="58" width="200" height="80" rx="8" fill="url(#strata-card)" stroke="#203352" stroke-width="1" />
  <text x="40" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">TOTAL PORTFOLIO</text>
  <text x="40" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">$12,850,400</text>
  <text x="160" y="114" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">+14.2%</text>

  <rect x="248" y="58" width="200" height="80" rx="8" fill="url(#strata-card)" stroke="#203352" stroke-width="1" />
  <text x="264" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">ANNUALIZED YIELD</text>
  <text x="264" y="114" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">8.95%</text>
  <text x="374" y="114" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Benchmark +3%</text>

  <rect x="472" y="58" width="204" height="80" rx="8" fill="url(#strata-card)" stroke="#203352" stroke-width="1" />
  <text x="488" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">CONVERSION FUNNEL</text>
  <text x="488" y="114" fill="#10B981" font-family="system-ui, sans-serif" font-size="24" font-weight="800">4.8x Leads</text>
  <text x="590" y="114" fill="#A7B0C0" font-family="system-ui, sans-serif" font-size="11">Quarterly</text>

  <!-- Main Wealth Projection Curve Chart -->
  <rect x="24" y="152" width="424" height="200" rx="8" fill="url(#strata-card)" stroke="#203352" stroke-width="1" />
  <text x="40" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Asset Growth &amp; Retirement Modeling Projection</text>

  <!-- Chart lines -->
  <line x1="40" y1="220" x2="420" y2="220" stroke="#1A2840" stroke-dasharray="3 3" />
  <line x1="40" y1="260" x2="420" y2="260" stroke="#1A2840" stroke-dasharray="3 3" />
  <line x1="40" y1="300" x2="420" y2="300" stroke="#1A2840" stroke-dasharray="3 3" />

  <!-- Projection Curves -->
  <path d="M 40 310 Q 140 290 220 260 T 340 210 T 420 170" stroke="#38BDF8" stroke-width="3" fill="none" />
  <path d="M 40 310 Q 140 300 220 280 T 340 250 T 420 225" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <rect x="340" y="170" width="80" height="22" rx="4" fill="#0A1424" stroke="#38BDF8" stroke-width="1" />
  <text x="350" y="185" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">$24.5M (2035)</text>

  <!-- Right Side Asset Allocation Pie / Donut Breakdown -->
  <rect x="464" y="152" width="212" height="200" rx="8" fill="url(#strata-card)" stroke="#203352" stroke-width="1" />
  <text x="480" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Strategic Allocation</text>

  <!-- Ring / Donut representation -->
  <circle cx="570" cy="245" r="46" stroke="#1E293B" stroke-width="14" fill="none" />
  <circle cx="570" cy="245" r="46" stroke="#38BDF8" stroke-width="14" stroke-dasharray="160 300" fill="none" />
  <circle cx="570" cy="245" r="46" stroke="#818CF8" stroke-width="14" stroke-dasharray="80 300" stroke-dashoffset="-160" fill="none" />
  <circle cx="570" cy="245" r="46" stroke="#10B981" stroke-width="14" stroke-dasharray="45 300" stroke-dashoffset="-240" fill="none" />

  <text x="552" y="248" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">65%</text>
  <text x="548" y="260" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="9">Equities</text>

  <text x="480" y="320" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">● Global Tech (55%)</text>
  <text x="480" y="336" fill="#818CF8" font-family="system-ui, sans-serif" font-size="10">● Fixed Income (25%)</text>

  <!-- Bottom Details Bar -->
  <rect x="24" y="366" width="652" height="64" rx="8" fill="#0A1220" stroke="#203352" stroke-width="1" />
  <text x="44" y="392" fill="#8E9BB0" font-family="monospace" font-size="11">EDITORIAL DESIGN &amp; NEXT.JS SPEED: High-trust typography, custom client calculators, SSL encryption.</text>
  <text x="44" y="414" fill="#00C6FF" font-family="monospace" font-size="10">Lighthouse Performance: 99 • Client Retention: 98.4%</text>
</svg>
