<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="zenith-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D22" />
      <stop offset="100%" stop-color="#06040B" />
    </linearGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <linearGradient id="zenith-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1538" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E091C" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" rx="12" fill="url(#zenith-bg)" stroke="#312252" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="0" y="0" width="700" height="42" fill="#0C0818" />
  <line x1="0" y1="42" x2="700" y2="42" stroke="#312252" stroke-width="1" />
  <circle cx="20" cy="21" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="36" cy="21" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="52" cy="21" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="26" fill="#CBD3E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Zenith Robotics • Modular Visual Identity &amp; Industrial Design System</text>
  
  <rect x="570" y="11" width="110" height="20" rx="10" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.4" />
  <text x="584" y="25" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DESIGN SYSTEM</text>

  <!-- Left: Geometric Logo Mark Construction -->
  <rect x="24" y="58" width="280" height="280" rx="10" fill="url(#zenith-card)" stroke="#352658" stroke-width="1" />
  <text x="44" y="86" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Geometric Vector Construction</text>
  <text x="44" y="104" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">Golden ratio vector grid</text>

  <!-- Construction Grid Circles & Lines -->
  <circle cx="164" cy="200" r="70" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="164" cy="200" r="45" stroke="#00C6FF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="94" y1="200" x2="234" y2="200" stroke="#8B5CF6" stroke-opacity="0.3" stroke-dasharray="2 2" />
  <line x1="164" y1="130" x2="164" y2="270" stroke="#8B5CF6" stroke-opacity="0.3" stroke-dasharray="2 2" />

  <!-- Zenith Futuristic Monogram Hexagon -->
  <polygon points="164,150 207,175 207,225 164,250 121,225 121,175" stroke="#00C6FF" stroke-width="3" fill="url(#purple-cyan)" fill-opacity="0.3" />
  <polygon points="164,165 194,182 194,218 164,235 134,218 134,182" stroke="#8B5CF6" stroke-width="2" fill="#0C0818" />
  <circle cx="164" cy="200" r="10" fill="#00C6FF" />

  <text x="115" y="310" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2">ZENITH</text>
  <text x="186" y="310" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ROBOTICS</text>

  <!-- Right Top: Color System Tokens -->
  <rect x="320" y="58" width="356" height="130" rx="10" fill="url(#zenith-card)" stroke="#352658" stroke-width="1" />
  <text x="340" y="86" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Digital Palette &amp; Color Swatches</text>
  
  <!-- Swatch 1 -->
  <rect x="340" y="104" width="68" height="50" rx="6" fill="#8B5CF6" />
  <text x="344" y="170" fill="#C4B5FD" font-family="monospace" font-size="9">#8B5CF6</text>
  <!-- Swatch 2 -->
  <rect x="424" y="104" width="68" height="50" rx="6" fill="#00C6FF" />
  <text x="428" y="170" fill="#7DD3FC" font-family="monospace" font-size="9">#00C6FF</text>
  <!-- Swatch 3 -->
  <rect x="508" y="104" width="68" height="50" rx="6" fill="#120D22" stroke="#352658" stroke-width="1" />
  <text x="512" y="170" fill="#A78BFA" font-family="monospace" font-size="9">#120D22</text>
  <!-- Swatch 4 -->
  <rect x="592" y="104" width="68" height="50" rx="6" fill="#10B981" />
  <text x="596" y="170" fill="#6EE7B7" font-family="monospace" font-size="9">#10B981</text>

  <!-- Right Bottom: Typography Specimen & Token Scalability -->
  <rect x="320" y="200" width="356" height="138" rx="10" fill="url(#zenith-card)" stroke="#352658" stroke-width="1" />
  <text x="340" y="228" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Typography Scale &amp; Vector Iconography</text>
  <text x="340" y="254" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Aa Bb Gg 1234 &amp; Modern</text>
  <text x="340" y="278" fill="#8E9BB0" font-family="monospace" font-size="11">Display: Inter Tight Bold 64px • Body: Inter Regular 16px</text>
  
  <rect x="340" y="294" width="94" height="22" rx="4" fill="#251944" />
  <text x="350" y="309" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10">24+ Custom Icons</text>
  <rect x="444" y="294" width="104" height="22" rx="4" fill="#251944" />
  <text x="454" y="309" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10">Brand Guidelines PDF</text>

  <!-- Bottom Details Bar -->
  <rect x="24" y="352" width="652" height="78" rx="8" fill="#0C0818" stroke="#312252" stroke-width="1" />
  <text x="44" y="378" fill="#CBD3E1" font-family="monospace" font-size="11">BRAND COLLATERAL &amp; VECTOR ASSETS DESIGNED BY NEXOVIO</text>
  <text x="44" y="400" fill="#C4B5FD" font-family="monospace" font-size="10">Investor Deck • 3D Hardware Spec Sheets • Digital Web System • Modular Icons</text>
</svg>
