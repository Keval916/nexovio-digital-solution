<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="apex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>
    <linearGradient id="apex-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1769FF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <linearGradient id="apex-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111B32" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080E1C" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" rx="12" fill="url(#apex-bg)" stroke="#1C2B47" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="700" height="42" fill="#0E1626" />
  <line x1="0" y1="42" x2="700" y2="42" stroke="#1C2B47" stroke-width="1" />
  <circle cx="20" cy="21" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="36" cy="21" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="52" cy="21" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="26" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Apex Cloud Infrastructure Control Center</text>
  
  <rect x="580" y="11" width="100" height="20" rx="10" fill="#00C6FF" fill-opacity="0.15" stroke="#00C6FF" stroke-opacity="0.3" />
  <circle cx="592" cy="21" r="3" fill="#00C6FF" />
  <text x="602" y="25" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">50K+ NODES</text>

  <!-- Metric 1: Telemetry Rate -->
  <rect x="24" y="58" width="200" height="80" rx="8" fill="url(#apex-card)" stroke="#1B2842" stroke-width="1" />
  <text x="40" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">INGESTION RATE</text>
  <text x="40" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">4.8 GB/s</text>
  <text x="160" y="114" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">▲ 99.9%</text>

  <!-- Metric 2: Latency -->
  <rect x="248" y="58" width="200" height="80" rx="8" fill="url(#apex-card)" stroke="#1B2842" stroke-width="1" />
  <text x="264" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">MEDIAN LATENCY</text>
  <text x="264" y="114" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">12.4 ms</text>
  <text x="384" y="114" fill="#00C6FF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">P99: 28ms</text>

  <!-- Metric 3: Cluster Health -->
  <rect x="472" y="58" width="204" height="80" rx="8" fill="url(#apex-card)" stroke="#1B2842" stroke-width="1" />
  <text x="488" y="80" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="11">CLUSTER TOPOLOGY</text>
  <text x="488" y="114" fill="#10B981" font-family="system-ui, sans-serif" font-size="24" font-weight="800">HEALTHY</text>
  <text x="596" y="114" fill="#A7B0C0" font-family="system-ui, sans-serif" font-size="11">24 Regions</text>

  <!-- Main Telemetry Wave Graph -->
  <rect x="24" y="152" width="424" height="190" rx="8" fill="url(#apex-card)" stroke="#1B2842" stroke-width="1" />
  <text x="40" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Continuous Telemetry Streaming</text>
  
  <path d="M 40 310 L 40 280 Q 90 260 140 240 T 240 220 T 340 190 L 424 180 L 424 310 Z" fill="url(#apex-accent)" fill-opacity="0.15" />
  <path d="M 40 280 Q 90 260 140 240 T 240 220 T 340 190 L 424 180" stroke="#00C6FF" stroke-width="2.5" fill="none" />
  
  <!-- Server Node Map -->
  <rect x="464" y="152" width="212" height="190" rx="8" fill="url(#apex-card)" stroke="#1B2842" stroke-width="1" />
  <text x="480" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Active Node Topology</text>
  
  <!-- Nodes Network visual -->
  <circle cx="510" cy="230" r="14" fill="#1769FF" fill-opacity="0.25" stroke="#1769FF" stroke-width="1.5" />
  <circle cx="510" cy="230" r="5" fill="#00C6FF" />
  
  <circle cx="620" cy="210" r="18" fill="#1769FF" fill-opacity="0.2" stroke="#00C6FF" stroke-width="1.5" />
  <circle cx="620" cy="210" r="6" fill="#00C6FF" />

  <circle cx="570" cy="290" r="16" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
  <circle cx="570" cy="290" r="5" fill="#10B981" />

  <line x1="510" y1="230" x2="620" y2="210" stroke="#1769FF" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="620" y1="210" x2="570" y2="290" stroke="#00C6FF" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="510" y1="230" x2="570" y2="290" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Bottom Details Bar -->
  <rect x="24" y="356" width="652" height="74" rx="8" fill="#09101E" stroke="#1B2842" stroke-width="1" />
  <text x="44" y="382" fill="#8E9BB0" font-family="monospace" font-size="11">ENGINEERED BY NEXOVIO: Next.js App Router • Strict TypeScript • Zero Layout Shift</text>
  <rect x="44" y="394" width="80" height="22" rx="4" fill="#142036" />
  <text x="56" y="409" fill="#00C6FF" font-family="monospace" font-size="10">Next.js 14</text>
  <rect x="132" y="394" width="90" height="22" rx="4" fill="#142036" />
  <text x="144" y="409" fill="#60A5FA" font-family="monospace" font-size="10">Tailwind CSS</text>
  <rect x="230" y="394" width="90" height="22" rx="4" fill="#142036" />
  <text x="242" y="409" fill="#10B981" font-family="monospace" font-size="10">WebSocket</text>
</svg>
